<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Merge Pro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#ffffff;
            color:#1f2937;
            display:flex;
            flex-direction:column;
            min-height:100vh;
        }

        /* HEADER */

        header{
            width:100%;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #e5e7eb;
            background:white;
        }

        .logo{
            font-size:28px;
            font-weight:700;
            color:#22c55e;
        }

        nav{
            display:flex;
            align-items:center;
        }

        nav a{
            text-decoration:none;
            color:#374151;
            margin-left:25px;
            font-weight:500;
            transition:0.3s;
        }

        nav a:hover{
            color:#22c55e;
        }

        /* HERO SECTION */

        .hero{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:50px 20px;
        }

        .card{
            width:100%;
            max-width:650px;
            background:#ffffff;
            border:1px solid #e5e7eb;
            border-radius:24px;
            padding:50px;
            text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.06);
        }

        .icon{
            font-size:70px;
            margin-bottom:20px;
        }

        h1{
            font-size:42px;
            margin-bottom:15px;
            color:#111827;
        }

        .subtitle{
            color:#6b7280;
            font-size:16px;
            margin-bottom:35px;
            line-height:1.7;
        }

        /* UPLOAD AREA */

        .upload-box{
            border:2px dashed #86efac;
            background:#f0fdf4;
            border-radius:18px;
            padding:40px 20px;
            cursor:pointer;
            transition:0.3s;
            margin-bottom:25px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }

        .upload-box:hover{
            background:#dcfce7;
        }

        .upload-title{
            font-size:20px;
            font-weight:600;
            color:#15803d;
            margin-bottom:10px;
        }

        .upload-subtitle{
            font-size:14px;
            color:#4b5563;
            margin-bottom:10px;
        }

        /* FILE LIST */

        .file-list{
            width:100%;
            margin-top:20px;
            text-align:left;
        }

        .file-item{
            background:white;
            border:1px solid #d1fae5;
            padding:12px 15px;
            border-radius:12px;
            margin-bottom:10px;
            font-size:14px;
            color:#374151;
        }

        /* BUTTON */

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:14px;
            background:#22c55e;
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#16a34a;
            transform:translateY(-1px);
        }

        /* FEATURES */

        .features{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:35px;
            flex-wrap:wrap;
        }

        .feature-box{
            background:#f9fafb;
            padding:15px 20px;
            border-radius:14px;
            font-size:14px;
            color:#374151;
            border:1px solid #e5e7eb;
        }

        /* FOOTER */

        footer{
            border-top:1px solid #e5e7eb;
            padding:20px;
            text-align:center;
            color:#6b7280;
            font-size:14px;
            background:white;
        }

        /* RESPONSIVE */

        @media(max-width:768px){

            header{
                padding:20px;
                flex-direction:column;
                gap:15px;
            }

            nav a{
                margin:0 10px;
            }

            .card{
                padding:35px 25px;
            }

            h1{
                font-size:32px;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            PDF Merge Pro
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">About</a>
        </nav>

    </header>

    <!-- HERO SECTION -->

    <section class="hero">

        <div class="card">

            <div class="icon">📄</div>

            <h1>Merge PDF Files</h1>

            <p class="subtitle">
                Easily combine multiple PDF documents into one clean file.
                Upload your PDFs and merge them instantly.
            </p>

            <form action="/merge" method="post" enctype="multipart/form-data">

                <!-- FIXED UPLOAD AREA -->

                <label for="fileInput" class="upload-box">

                    <div class="upload-title">
                        Upload PDF Files
                    </div>

                    <div class="upload-subtitle">
                        Click here to choose multiple PDF documents
                    </div>

                    <div class="file-list" id="fileList"></div>

                </label>

                <!-- HIDDEN INPUT -->

                <input 
                    type="file"
                    name="files"
                    id="fileInput"
                    multiple
                    accept=".pdf"
                    hidden
                >

                <button type="submit">
                    Merge PDFs
                </button>

            </form>

            <!-- FEATURES -->

            <div class="features">

                <div class="feature-box">
                    ⚡ Fast Processing
                </div>

                <div class="feature-box">
                    🔒 Secure Uploads
                </div>

                <div class="feature-box">
                    📄 Unlimited PDFs
                </div>

            </div>

        </div>

    </section>

    <!-- FOOTER -->

    <footer>
        © 2026 PDF Merge Pro • Built with FastAPI
    </footer>

    <!-- SCRIPT -->

    <script>

        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');

        fileInput.addEventListener('change', () => {

            fileList.innerHTML = '';

            for(let file of fileInput.files){

                const div = document.createElement('div');

                div.classList.add('file-item');

                div.innerHTML = `📄 ${file.name}`;

                fileList.appendChild(div);

            }

        });

    </script>

</body>
</html>
